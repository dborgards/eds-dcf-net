name: Build and Test

permissions:
  contents: read
  statuses: write
  checks: write

env:
  COVERAGE_MIN_PERCENT: "95.0"

# Concurrency: pull_request runs are grouped per PR and a newer push to the PR
# cancels the older run. Every other event (push to develop, workflow_dispatch,
# workflow_run) gets its own group, so those runs are never cancelled or
# replaced by a pending one: the relay for a release commit and the checks of a
# develop push must always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # push is limited to develop. Branches with an open PR are built by the
  # pull_request trigger, so a push to a PR branch no longer runs twice.
  # main is built by semantic-release.yml. A branch without a PR is not built
  # on push; open a (draft) PR or use workflow_dispatch to get a run.
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  # Relay required check statuses for release commits
  # (chore(release): <version>, committer semantic-release-bot).
  # The push-triggered build, npm-lockfile, and breaking-intent jobs skip that
  # commit via `if:` so the push does not repeat the build Semantic Release
  # already ran. A job skipped by `if:` reports success, but it does not post
  # coverage/threshold. Once Semantic Release finishes, this trigger fires and
  # relay-release-status posts the required check runs for the release commit SHA.
  #
  # Those commits must not contain a skip directive ([skip ci], [ci skip],
  # [no ci], [skip actions], [actions skip], or a skip-checks trailer). GitHub
  # applies a directive before any job `if:`, to every push and pull_request
  # workflow, and leaves the checks pending. A develop→main PR is usually
  # headed by the latest release commit, so a directive there skips apicompat,
  # npm-lockfile, and breaking-intent. The push guard keys off the commit
  # message and committer name, not github.actor: RELEASE_TOKEN pushes as the
  # token owner, while semantic-release-bot is only GIT_COMMITTER_NAME.
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
    branches: [main, develop]

jobs:
  # Classifies the change so documentation-only runs can skip the heavy steps.
  # It is a job of its own, not a workflow-level `paths-ignore`: a workflow that
  # does not start leaves the required checks (`build`, `coverage/threshold`)
  # unreported and blocks the PR. The jobs below always start and report; only
  # their steps are skipped via `if:`.
  #
  # docs_only is true only when every changed file is documentation (root
  # *.md, docs/**, .github/*.md, LICENSE*) AND the run is a pull_request into
  # develop or a push to develop. A pull_request into main always runs in full:
  # Codecov's own required check on main is only reported after a coverage
  # upload. Any doubt (workflow_dispatch, missing or unknown base/before SHA,
  # empty diff, git error) yields a full run. Plain git, no third-party action.
  changes:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect documentation-only changes
      id: classify
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        docs_only=false
        range=""
        if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "develop" ]]; then
          # Three-dot: changes since the merge base, like the PR's file list;
          # --no-renames lists a rename's source path as well as its target.
          range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
        elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
          range="${PUSH_BEFORE}...${PUSH_AFTER}"
        fi

        if [[ -n "$range" ]] && files=$(git diff --name-only --no-renames "$range") && [[ -n "$files" ]]; then
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              docs/*|LICENSE|LICENSE.*|.github/*.md) ;;
              */*) docs_only=false ;;
              *.md) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"
          echo "Changed files:"
          echo "$files"
        else
          echo "No usable diff range for '${EVENT_NAME}' (base '${BASE_REF}'); running the full workflow."
        fi
        echo "docs_only=${docs_only}"
        echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Skip workflow_run (relay-release-status owns that event) and skip a push
    # of the semantic-release commit. pull_request and workflow_dispatch still
    # run, including a develop→main PR whose HEAD is that commit.
    if: >-
      github.event_name != 'workflow_run' &&
      !(github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot')
    # windows-latest is required so the net48 test host can bind and execute the
    # library's netstandard2.0 asset (net10.0 runs on the same job).
    runs-on: windows-latest

    # On a documentation-only change (needs.changes.outputs.docs_only) the
    # heavy steps below are skipped, the job still ends with success and the
    # status step posts coverage/threshold, so both required checks report.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.changes.outputs.docs_only != 'true'
      with:
        fetch-depth: 0

    - name: Setup .NET
      if: needs.changes.outputs.docs_only != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        # SDK 10 from global.json builds the library and runs net10.0 tests;
        # net48 (preinstalled on windows-latest) exercises the netstandard2.0 asset.
        global-json-file: global.json

    - name: Restore dependencies
      if: needs.changes.outputs.docs_only != 'true'
      run: dotnet restore

    - name: Build
      if: needs.changes.outputs.docs_only != 'true'
      env:
        CI: true
      run: dotnet build --configuration Release --no-restore

    # Results go to a fresh directory outside the checkout. The gate and the
    # Codecov upload both use that path, so a coverage.cobertura.xml in the
    # working tree is not an input. shell is bash on purpose: windows-latest
    # defaults to PowerShell, and the gate's find needs the POSIX path mktemp
    # returns. dotnet receives the Windows path with MSYS path conversion
    # disabled so Git Bash does not rewrite the backslashes.
    - name: Test
      id: test
      if: needs.changes.outputs.docs_only != 'true'
      shell: bash
      run: |
        if [[ -z "${RUNNER_TEMP:-}" ]]; then
          echo "RUNNER_TEMP is not set." >&2
          exit 1
        fi
        temp_root="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
        fi
        results="$(mktemp -d "${temp_root}/coverage.XXXXXX")"
        dotnet_results="$results"
        if command -v cygpath >/dev/null 2>&1; then
          dotnet_results="$(cygpath -w "$results")"
        fi
        MSYS_NO_PATHCONV=1 dotnet test --configuration Release --no-build --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory "$dotnet_results"
        echo "results_directory=${results}" >> "$GITHUB_OUTPUT"

    # Shared gate with semantic-release.yml — see tools/enforce-coverage-threshold.sh.
    - name: Enforce coverage threshold
      id: coverage_gate
      if: needs.changes.outputs.docs_only != 'true'
      shell: bash
      run: bash tools/enforce-coverage-threshold.sh "${{ steps.test.outputs.results_directory }}"

    - name: Upload coverage reports to Codecov
      if: always() && steps.coverage_gate.outputs.coverage_files != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.coverage_gate.outputs.coverage_files }}
        disable_search: true
        override_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        fail_ci_if_error: true

    # Repository line-coverage gate, posted under its own context so it does
    # not overwrite Codecov's patch check. Still run when coverage_files is
    # empty so a gate failure with no Cobertura reports can post failure
    # (avoids a pending required check).
    # A documentation-only change posts success here instead of running the gate.
    - name: Post coverage/threshold status
      if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        outcome="${{ steps.coverage_gate.outcome }}"
        if [[ "${{ needs.changes.outputs.docs_only }}" == "true" ]]; then
          # Nothing to measure: the coverage gate step was skipped on purpose.
          state="success"
          description="Documentation-only change; coverage gate not applicable"
        elif [[ "$outcome" == "success" ]]; then
          state="success"
          description="Coverage ${{ steps.coverage_gate.outputs.coverage_percent }}% >= ${COVERAGE_MIN_PERCENT}%"
        elif [[ "$outcome" == "failure" ]]; then
          state="failure"
          description="Coverage gate failed (< ${COVERAGE_MIN_PERCENT}%)"
        else
          echo "Coverage gate was skipped (build/test failed earlier); not posting status."
          exit 0
        fi

        gh api "repos/${{ github.repository }}/statuses/${COMMIT_SHA}" \
          --method POST \
          -f state="${state}" \
          -f context="coverage/threshold" \
          -f description="${description}" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Guards the lockfile against package.json/package-lock.json drift.
  #
  # npm runs nowhere else in this workflow: the only `npm ci` is in
  # semantic-release.yml, which fires *after* a merge to develop. Renovate npm
  # PRs therefore stay green while breaking the release run — twice now, both
  # times because a lockfile update dropped the overridden undici node instead
  # of updating it (#502/#506, #515/#519). This job reproduces that exact step
  # on the PR so the drift is caught before merge.
  #
  # Not relayed by relay-release-status (which posts only `build`). The same
  # release-push `if:` as `build` reports success on that push, so the check
  # does not stay pending. pull_request runs it, including a develop→main
  # release PR. Do not put a skip directive back into the release commit:
  # GitHub would skip this job on that PR before the `if:` is evaluated.
  npm-lockfile:
    if: >-
      github.event_name != 'workflow_run' &&
      !(github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # Keep in sync with semantic-release.yml — this job exists to reproduce
        # that workflow's install step.
        node-version: '24.21.x'

    # Same command as semantic-release.yml. Fails on any package.json /
    # package-lock.json mismatch (npm error code EUSAGE).
    - name: Verify package-lock.json is in sync
      run: npm ci

  # Fixture check for the jq program embedded in the apicompat job below.
  # That program is the opt-in for an announced Major bump; a loosened
  # footer pattern would skip "Fail on unannounced breaking changes".
  # Not relayed by relay-release-status (which posts only `build`).
  # Same release-push guard as `build`: the fixture still runs on pull_request,
  # including a develop→main release PR.
  breaking-intent:
    if: >-
      github.event_name != 'workflow_run' &&
      !(github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check breaking-change intent regex
      run: bash tools/breaking-change-intent.test.sh

    # Same checkout-only fixture style. release-notes-generator must share
    # the analyzer's parserOpts.noteKeywords; the preset default still
    # matches BREAKING-CHANGE and that wrote the false 1.13.0 section.
    - name: Check release-notes parserOpts note keywords
      run: bash tools/release-notes-parser-opts.test.sh

    # Release commits must not carry a skip directive, and the push-only job
    # guard must keep pull_request gates (including this job) scheduled.
    - name: Check release PRs still run PR gates
      run: bash tools/release-pr-gates.test.sh

    # The coverage gate reads only the fresh results directory. A
    # coverage.cobertura.xml in the checkout must not change the result.
    - name: Check coverage gate scope
      run: bash tools/coverage-gate.test.sh

  # Compares the built public API against the same API built from the PR's
  # base branch (Microsoft.DotNet.ApiCompat). semantic-release derives the
  # version bump from commit types, not from the actual API delta — this job
  # makes an accidental breaking change in a feat:/fix: PR fail CI instead of
  # shipping as a Minor/Patch.
  #
  # Compared against the PR's own base branch, not the latest stable NuGet
  # package: `develop` only ever publishes beta pre-releases, so an accepted
  # breaking change can sit there unreleased as stable for a while — every
  # subsequent, unrelated PR into develop would otherwise inherit blame for
  # someone else's change. For a develop -> main release PR the base branch
  # (main) IS the last published stable version, so this is equivalent to the
  # original "vs latest stable" comparison there, without a NuGet download.
  #
  # pull_request only. The steps need the pull_request payload (base SHA,
  # commit list, PR number). relay-release-status posts only `build`, so a
  # push does not create this check. The job runs for every pull_request into
  # develop or main, including a develop→main release PR. That requires the
  # release commit to omit skip directives: GitHub would skip this workflow
  # before this `if:` is evaluated, which is how those PRs used to miss the gate.
  #
  # On a documentation-only change the build and compare steps are skipped
  # (step-level `if:`, the job `if:` above stays as is); the job ends with
  # success.
  apicompat:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Breaking-change commit detection queries the GitHub API (not local git
      # history), and the compatibility baseline comes from the separate base
      # branch checkout below — no full-history clone needed here.

    - name: Checkout PR base branch
      if: needs.changes.outputs.docs_only != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base-branch

    - name: Setup .NET (PR head)
      if: needs.changes.outputs.docs_only != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    # dotnet resolves the SDK from the nearest global.json to the invoked
    # working directory, so building base-branch/ with `working-directory:`
    # below picks up base-branch/global.json — which may pin an older SDK
    # feature band than the PR head (e.g. a PR that bumps global.json
    # itself). rollForward: latestPatch cannot cross feature bands, so that
    # older SDK must be installed too, or the base build fails outright and
    # apicompat never runs.
    - name: Setup .NET (PR base branch)
      if: needs.changes.outputs.docs_only != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: base-branch/global.json

    - name: Build library (PR head)
      if: needs.changes.outputs.docs_only != 'true'
      run: dotnet build src/EdsDcfNet/EdsDcfNet.csproj --configuration Release

    - name: Build library (PR base branch)
      if: needs.changes.outputs.docs_only != 'true'
      run: dotnet build src/EdsDcfNet/EdsDcfNet.csproj --configuration Release
      working-directory: base-branch

    - name: Install ApiCompat tool
      if: needs.changes.outputs.docs_only != 'true'
      # Pinned to the global.json SDK version so a new tool release can't silently
      # change diagnostics or CLI flags underneath an unrelated PR.
      run: dotnet tool install --global Microsoft.DotNet.ApiCompat.Tool --version 10.0.400

    # Differences are a failure by default. They are tolerated only when a PR
    # commit carries a signal that semantic-release itself (.releaserc.json)
    # treats as a Major bump: a `!` after the type, the `breaking`/`major`
    # commit type, or a `BREAKING CHANGE:`/`BREAKING CHANGES:` footer
    # (commit-analyzer's `parserOpts.noteKeywords`). A GitHub label has
    # no effect on semantic-release's version calculation, so it is
    # deliberately not accepted here — that would let apicompat pass while the
    # release still ships as a Minor/Patch, silently breaking consumers.
    - name: Detect explicit breaking-change intent
      id: breaking
      if: needs.changes.outputs.docs_only != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pr="${{ github.event.pull_request.number }}"
        # The REST pulls/{pr}/commits endpoint below is documented to return
        # at most 250 commits, even with --paginate: pagination pages through
        # what the endpoint has, not past its own hard cap. Check the PR's
        # real commit count via GraphQL's totalCount (uncapped) first, so a
        # marker past commit #250 fails loudly instead of silently landing on
        # "no breaking intent" from a truncated view.
        if ! total_commits=$(gh api graphql -f query='
          query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) { commits { totalCount } }
            }
          }' -F owner="${{ github.repository_owner }}" -F repo="${{ github.event.repository.name }}" -F pr="$pr" \
          --jq '.data.repository.pullRequest.commits.totalCount'); then
          echo "::error::Failed to determine the PR's total commit count — cannot determine breaking-change intent."
          exit 1
        fi
        if [ "$total_commits" -gt 250 ]; then
          echo "::error::This PR has ${total_commits} commits, past the GitHub REST API's 250-commit cap on the pull-request commits endpoint. Automated breaking-change detection cannot see the full commit list; squash/rebase the PR or verify manually."
          exit 1
        fi
        # Evaluated per commit, header vs. body/footer, matching how the
        # conventionalcommits parser actually derives type/notes: a bare
        # grep over the flattened, concatenated commit messages would also
        # match a `!`/`breaking:`/`major:`-looking line inside some other
        # commit's body, or a `BREAKING CHANGE:`-looking commit *subject*
        # (which parses as an unrecognized type, not a note) — both false
        # positives that would incorrectly let an unannounced breaking change
        # through. Conversely, `noteKeywords` deliberately excludes a bare
        # `BREAKING` alternative: it matched ordinary prose describing these
        # very keywords in a commit body and triggered an unintended Major
        # release, the opposite false positive.
        # The footer separator is stricter than the parser's notesPattern
        # (`[:\s]+`). Only a colon plus whitespace counts (`BREAKING CHANGE:`
        # / `BREAKING CHANGES:`), matching CONTRIBUTING.md and Conventional
        # Commits. `BREAKING CHANGE this removes Foo` is not an opt-in.
        jq_program='
          [.[].commit.message] | any(
            . as $msg |
            ($msg | split("\n")) as $lines |
            ((($lines[0] // "") | test("^[a-zA-Z]+(\\([^)]*\\))?!: "))
              or (($lines[0] // "") | test("^(breaking|major)(\\([^)]*\\))?: ")))
            or
            (($lines[1:] | join("\n")) | test("(?mi)^[\\s|*]*(BREAKING CHANGE|BREAKING CHANGES):\\s+"))
          )
        '
        if ! results=$(gh api --paginate "repos/${{ github.repository }}/pulls/$pr/commits" --jq "$jq_program"); then
          echo "::error::Failed to fetch PR commits from the GitHub API — cannot determine breaking-change intent."
          exit 1
        fi
        intent="false"
        if echo "$results" | grep -qx true; then
          echo "PR contains a commit that triggers a semantic-release Major bump."
          intent="true"
        fi
        echo "intent=${intent}" >> "$GITHUB_OUTPUT"

    - name: Run ApiCompat against PR base branch
      id: apicompat
      if: needs.changes.outputs.docs_only != 'true'
      run: |
        set +e
        bash tools/apicompat-check.sh src/EdsDcfNet/bin/Release base-branch/src/EdsDcfNet/bin/Release "$RUNNER_TEMP/apicompat"
        rc=$?
        set -e
        # rc 2 is an infrastructure failure — fail the step normally.
        if [ "$rc" -eq 2 ]; then exit 2; fi
        if [ "$rc" -eq 0 ]; then result="compatible"; else result="incompatible"; fi
        echo "result=${result}" >> "$GITHUB_OUTPUT"

    - name: Post API diff as PR comment
      if: steps.apicompat.outputs.result == 'incompatible' && steps.breaking.outputs.intent == 'true'
      # Best-effort: e.g. GITHUB_TOKEN is read-only on pull_request runs triggered
      # from a fork, so `gh pr comment` fails there regardless of the job's
      # `pull-requests: write` permission. That must not fail a PR that already
      # did the right thing by declaring its breaking change.
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        {
          echo "## Public API compatibility diff"
          echo
          echo "ApiCompat reports breaking changes against this PR's base branch."
          echo "This PR explicitly opts in via a commit that triggers a semantic-release"
          echo "Major bump, so the check passes — the diff is recorded here for review:"
          echo
          cat "$RUNNER_TEMP/apicompat/apicompat-diff.md"
        } > "$RUNNER_TEMP/apicompat-comment.md"
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/apicompat-comment.md"

    - name: Fail on unannounced breaking changes
      if: steps.apicompat.outputs.result == 'incompatible' && steps.breaking.outputs.intent != 'true'
      run: |
        cat "$RUNNER_TEMP/apicompat/apicompat-diff.md"
        echo "::error::Public API is not compatible with this PR's base branch. Either revert the breaking change or add a commit with a '!' after the type, the 'breaking'/'major' type, or a 'BREAKING CHANGE:'/'BREAKING CHANGES:' footer (Major release)."
        exit 1

  # Relays required check statuses for release commits. Semantic Release already
  # built and tested that code; the push-triggered build job skips the release
  # commit (see its `if:`), so this job forwards the workflow outcome onto the
  # release commit SHA.
  #
  # Why resolve the branch HEAD instead of using head_sha:
  # github.event.workflow_run.head_sha is the commit that *triggered* the Semantic
  # Release workflow. During that run, semantic-release creates and pushes a new
  # "chore(release): …" commit. By the time workflow_run fires, the branch
  # HEAD is that new release commit — which is the SHA that actually needs the required
  # checks. If the branch HEAD equals head_sha, semantic-release did not publish a
  # release this run and there is nothing to relay.
  #
  # HEAD ≠ trigger SHA alone is not enough: another commit can land on the branch in
  # the race window between the release push and this job resolving refs. Verify the
  # resolved HEAD is actually the semantic-release commit (message, committer, and
  # first parent == trigger SHA) before posting required checks.
  relay-release-status:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest

    steps:
    - name: Resolve release commit SHA
      id: resolve_sha
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        branch="${{ github.event.workflow_run.head_branch }}"
        trigger_sha="${{ github.event.workflow_run.head_sha }}"

        # Fetch the current HEAD of the branch — this will be the release
        # commit if semantic-release published a new version during the workflow run.
        current_sha=$(gh api "repos/${{ github.repository }}/git/refs/heads/${branch}" --jq '.object.sha')

        if [[ "$current_sha" == "$trigger_sha" ]]; then
          echo "Branch HEAD unchanged — semantic-release did not publish a release. Nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        commit_json=$(gh api "repos/${{ github.repository }}/commits/${current_sha}")
        message=$(jq -r '.commit.message' <<< "$commit_json")
        committer=$(jq -r '.commit.committer.name' <<< "$commit_json")
        parent_sha=$(jq -r '.parents[0].sha // empty' <<< "$commit_json")

        if [[ "$message" != "chore(release):"* ]]; then
          echo "HEAD ${current_sha} is not a chore(release) commit; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$committer" != "semantic-release-bot" ]]; then
          echo "HEAD ${current_sha} committer is '${committer}', expected semantic-release-bot; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$parent_sha" != "$trigger_sha" ]]; then
          echo "HEAD ${current_sha} parent is ${parent_sha}, expected trigger ${trigger_sha}; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Release commit verified: ${current_sha} (trigger was ${trigger_sha})"
        echo "release_sha=${current_sha}" >> "$GITHUB_OUTPUT"

    - name: Post build check run for release commit
      if: steps.resolve_sha.outputs.release_sha != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha="${{ steps.resolve_sha.outputs.release_sha }}"
        conclusion="${{ github.event.workflow_run.conclusion }}"

        if [[ "$conclusion" == "success" ]]; then
          check_conclusion="success"
          summary="Build and tests passed in Semantic Release workflow."
        else
          check_conclusion="failure"
          summary="Semantic Release workflow did not succeed (conclusion: ${conclusion})."
        fi

        gh api repos/${{ github.repository }}/check-runs \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -f name="build" \
          -f head_sha="$sha" \
          -f status="completed" \
          -f conclusion="$check_conclusion" \
          -f "output[title]=Build (relayed from Semantic Release)" \
          -f "output[summary]=$summary"

    - name: Post coverage/threshold status for release commit
      if: always() && steps.resolve_sha.outputs.release_sha != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha="${{ steps.resolve_sha.outputs.release_sha }}"
        conclusion="${{ github.event.workflow_run.conclusion }}"

        if [[ "$conclusion" == "success" ]]; then
          state="success"
          description="Release commit — build verified by Semantic Release workflow"
        else
          state="failure"
          description="Semantic Release workflow did not succeed"
        fi

        gh api "repos/${{ github.repository }}/statuses/${sha}" \
          --method POST \
          -f state="${state}" \
          -f context="coverage/threshold" \
          -f description="${description}" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
