name: Build and Test

permissions:
  contents: read
  statuses: write
  checks: write

env:
  COVERAGE_MIN_PERCENT: "95.0"

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  # Relay required check statuses for release commits (chore(release): ... [skip ci]).
  # Those commits skip the push trigger, but the Semantic Release workflow already built
  # and tested the code. Once that workflow finishes, this trigger fires and the
  # relay-release-status job posts the required check runs for the release commit SHA.
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
    branches: [main, develop]

jobs:
  build:
    if: github.event_name != 'workflow_run'
    # windows-latest is required so the net48 test host can bind and execute the
    # library's netstandard2.0 asset (net10.0 runs on the same job).
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        # SDK 10 from global.json builds the library and runs net10.0 tests;
        # net48 (preinstalled on windows-latest) exercises the netstandard2.0 asset.
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      env:
        CI: true
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # Shared gate with semantic-release.yml — see tools/enforce-coverage-threshold.sh.
    - name: Enforce coverage threshold
      id: coverage_gate
      shell: bash
      run: bash tools/enforce-coverage-threshold.sh .

    # Timestamp before upload so the wait loop can ignore stale Codecov
    # statuses/check-runs left on the same SHA from a previous workflow attempt.
    - name: Record Codecov wait baseline
      id: codecov_baseline
      if: always() && steps.coverage_gate.outputs.coverage_files != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
      shell: bash
      run: echo "after=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Upload coverage reports to Codecov
      if: always() && steps.coverage_gate.outputs.coverage_files != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.coverage_gate.outputs.coverage_files }}
        disable_search: true
        override_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        fail_ci_if_error: true

    # Same event gate as the Codecov upload step (PR/develop). Feature-branch
    # pushes never upload, so waiting for Codecov would burn ~4 minutes.
    # Still run when coverage_files is empty so a gate failure with no Cobertura
    # reports can post failure (avoids a pending required check); the wait loop
    # below is skipped in that case because upload did not run.
    - name: Post codecov/patch status
      if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        CODECOV_AFTER: ${{ steps.codecov_baseline.outputs.after }}
      run: |
        outcome="${{ steps.coverage_gate.outcome }}"
        if [[ "$outcome" == "success" ]]; then
          state="success"
          description="Coverage ${{ steps.coverage_gate.outputs.coverage_percent }}% >= ${COVERAGE_MIN_PERCENT}%"
        elif [[ "$outcome" == "failure" ]]; then
          state="failure"
          description="Coverage gate failed (< ${COVERAGE_MIN_PERCENT}%)"
        else
          echo "Coverage gate was skipped (build/test failed earlier); not posting status."
          exit 0
        fi

        # Wait for Codecov only when upload ran (coverage files present). With no
        # files, Codecov never reports; waiting wastes ~4m.
        # Codecov may report as a commit status (codecov[bot], typical on develop
        # pushes) or as a Check Run (Codecov GitHub App, typical on PRs). Poll both;
        # looking only at statuses misses PR check-runs and burns the full timeout.
        # Only accept reports created after CODECOV_AFTER (upload start) so a
        # workflow re-run on the same SHA does not treat the previous attempt's
        # completed codecov/patch as done before this upload finishes.
        # Portable loop (Git Bash on windows-latest may lack `seq`).
        # Required by the develop branch ruleset integration_id constraint: our
        # Actions status must be posted after Codecov's report.
        if [[ -n "${{ steps.coverage_gate.outputs.coverage_files }}" ]]; then
          i=1
          while [[ "$i" -le 24 ]]; do
            # Inline CODECOV_AFTER: `gh api --jq` does not support jq --arg.
            codecov_bot_status=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/statuses" \
              --jq "[.[] | select(.context == \"codecov/patch\" and (.creator.login == \"codecov[bot]\") and (.created_at // \"\") >= \"${CODECOV_AFTER}\")][0].state // empty" 2>/dev/null || true)
            if [[ -n "$codecov_bot_status" ]]; then
              echo "Codecov webhook status detected (${codecov_bot_status}) after ~$((i * 10))s"
              break
            fi
            codecov_check=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"codecov/patch\" and .app.slug == \"codecov\" and .status == \"completed\" and (.completed_at // \"\") >= \"${CODECOV_AFTER}\")][0].conclusion // empty" 2>/dev/null || true)
            if [[ -n "$codecov_check" ]]; then
              echo "Codecov check run detected (${codecov_check}) after ~$((i * 10))s"
              break
            fi
            echo "Waiting for Codecov webhook/check... (attempt $i/24)"
            sleep 10
            i=$((i + 1))
          done
        else
          echo "No coverage files uploaded; skipping Codecov webhook wait."
        fi

        gh api "repos/${{ github.repository }}/statuses/${COMMIT_SHA}" \
          --method POST \
          -f state="${state}" \
          -f context="codecov/patch" \
          -f description="${description}" \
          -f target_url="https://app.codecov.io/github/${{ github.repository }}"

  # Relays required check statuses for release commits that carry [skip ci].
  # The Semantic Release workflow already built and tested the code; this job simply
  # forwards its outcome to the release commit SHA so PR required checks are satisfied.
  #
  # Why resolve the branch HEAD instead of using head_sha:
  # github.event.workflow_run.head_sha is the commit that *triggered* the Semantic
  # Release workflow. During that run, semantic-release creates and pushes a new
  # "chore(release): … [skip ci]" commit. By the time workflow_run fires, the branch
  # HEAD is that new release commit — which is the SHA that actually needs the required
  # checks. If the branch HEAD equals head_sha, semantic-release did not publish a
  # release this run and there is nothing to relay.
  #
  # HEAD ≠ trigger SHA alone is not enough: another commit can land on the branch in
  # the race window between the release push and this job resolving refs. Verify the
  # resolved HEAD is actually the semantic-release commit (message, committer, and
  # first parent == trigger SHA) before posting required checks.
  relay-release-status:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest

    steps:
    - name: Resolve release commit SHA
      id: resolve_sha
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        branch="${{ github.event.workflow_run.head_branch }}"
        trigger_sha="${{ github.event.workflow_run.head_sha }}"

        # Fetch the current HEAD of the branch — this will be the [skip ci] release
        # commit if semantic-release published a new version during the workflow run.
        current_sha=$(gh api "repos/${{ github.repository }}/git/refs/heads/${branch}" --jq '.object.sha')

        if [[ "$current_sha" == "$trigger_sha" ]]; then
          echo "Branch HEAD unchanged — semantic-release did not publish a release. Nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        commit_json=$(gh api "repos/${{ github.repository }}/commits/${current_sha}")
        message=$(jq -r '.commit.message' <<< "$commit_json")
        committer=$(jq -r '.commit.committer.name' <<< "$commit_json")
        parent_sha=$(jq -r '.parents[0].sha // empty' <<< "$commit_json")

        if [[ "$message" != "chore(release):"* ]]; then
          echo "HEAD ${current_sha} is not a chore(release) commit; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$committer" != "semantic-release-bot" ]]; then
          echo "HEAD ${current_sha} committer is '${committer}', expected semantic-release-bot; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$parent_sha" != "$trigger_sha" ]]; then
          echo "HEAD ${current_sha} parent is ${parent_sha}, expected trigger ${trigger_sha}; nothing to relay."
          echo "release_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Release commit verified: ${current_sha} (trigger was ${trigger_sha})"
        echo "release_sha=${current_sha}" >> "$GITHUB_OUTPUT"

    - name: Post build check run for release commit
      if: steps.resolve_sha.outputs.release_sha != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha="${{ steps.resolve_sha.outputs.release_sha }}"
        conclusion="${{ github.event.workflow_run.conclusion }}"

        if [[ "$conclusion" == "success" ]]; then
          check_conclusion="success"
          summary="Build and tests passed in Semantic Release workflow."
        else
          check_conclusion="failure"
          summary="Semantic Release workflow did not succeed (conclusion: ${conclusion})."
        fi

        gh api repos/${{ github.repository }}/check-runs \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -f name="build" \
          -f head_sha="$sha" \
          -f status="completed" \
          -f conclusion="$check_conclusion" \
          -f "output[title]=Build (relayed from Semantic Release)" \
          -f "output[summary]=$summary"

    - name: Post codecov/patch status for release commit
      if: always() && steps.resolve_sha.outputs.release_sha != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha="${{ steps.resolve_sha.outputs.release_sha }}"
        conclusion="${{ github.event.workflow_run.conclusion }}"

        if [[ "$conclusion" == "success" ]]; then
          state="success"
          description="Release commit — build verified by Semantic Release workflow"
        else
          state="failure"
          description="Semantic Release workflow did not succeed"
        fi

        gh api "repos/${{ github.repository }}/statuses/${sha}" \
          --method POST \
          -f state="${state}" \
          -f context="codecov/patch" \
          -f description="${description}" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
