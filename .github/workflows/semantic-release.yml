name: Semantic Release

env:
  COVERAGE_MIN_PERCENT: "95.0"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Release runs must not overlap. semantic-release pushes the tag and channel
  # note before the publish plugins run, so a second run starting in that window
  # sees a release that looks incomplete but is only in progress — and would
  # launch a repair racing the publish it duplicates.
  #
  # Queue rather than cancel: cancelling a run mid-publish is precisely how the
  # partial releases this pipeline repairs come about.
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # windows-latest is required so the net48 test host can bind and execute the
    # library's netstandard2.0 asset before publishing (net10.0 runs on the same job).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.x'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # SDK 10 from global.json builds the library and runs net10.0 tests;
          # net48 (preinstalled on windows-latest) exercises the netstandard2.0 asset.
          global-json-file: global.json

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build
        env:
          CI: true
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      # Shared gate with build.yml — see tools/enforce-coverage-threshold.sh.
      - name: Enforce coverage threshold
        id: coverage_gate
        shell: bash
        run: bash tools/enforce-coverage-threshold.sh .

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_gate.outputs.coverage_files }}
          disable_search: true
          fail_ci_if_error: true

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CREDENTIALS: x-access-token:${{ secrets.RELEASE_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
        shell: bash
        run: bash tools/semantic-release-run.sh
