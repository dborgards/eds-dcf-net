name: Semantic Release

env:
  COVERAGE_MIN_PERCENT: "95.0"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Release runs must not overlap. semantic-release pushes the tag and channel
  # note before the publish plugins run, so a second run starting in that window
  # sees a release that looks incomplete but is only in progress — and would
  # launch a repair racing the publish it duplicates.
  #
  # The group is repository-wide rather than per-ref on purpose. main and
  # develop can act on the *same* tag: verify_last_release considers reachable
  # stable tags on develop too, because semantic-release does, so a back-merge
  # firing develop while main publishes that stable release would have both
  # jobs repairing it at once.
  #
  # This trade is not free, and the cost falls on the more valuable side.
  # cancel-in-progress: false protects the run that is *executing*, but Actions
  # keeps only one *pending* run per group: a newly queued run cancels the
  # pending one. Sharing a group across channels therefore lets a develop push
  # cancel a queued main release, and nothing retries it — the commit is
  # already on main, so no further push fires the workflow, and that release
  # stays missing until the next one. Weigh that against the duplicated publish
  # it prevents before narrowing or widening this group again.
  #
  # Only main and develop share the group. workflow_dispatch accepts any ref,
  # and such a run publishes nothing — it plans no version and skips
  # verification — but it would still join the queue and evict a pending
  # production release on its way to doing nothing. Non-channel refs therefore
  # get a group of their own.
  #
  # A release-commit push (chore(release): by semantic-release-bot) must not
  # carry [skip ci]: that directive would also skip every develop→main
  # pull_request workflow. The push therefore still starts this workflow, and
  # the job `if:` below skips the release work. Concurrency is chosen when the
  # run is queued, before that `if` runs. One pending run per group means the
  # no-op would cancel a queued main or develop release, and nothing retries a
  # commit already on the branch. Those pushes get semantic-release-noop-<sha>
  # so they cannot evict, or be evicted by, a real release.
  #
  # Queue rather than cancel: cancelling a run mid-publish is precisely how the
  # partial releases this pipeline repairs come about.
  group: >-
    ${{
      (github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot') &&
      format('semantic-release-noop-{0}', github.sha) ||
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      'semantic-release-channels' ||
      format('semantic-release-{0}', github.ref)
    }}
  cancel-in-progress: false

jobs:
  release:
    # windows-latest is required so the net48 test host can bind and execute the
    # library's netstandard2.0 asset before publishing (net10.0 runs on the same job).
    #
    # The release commit is pushed with RELEASE_TOKEN, which starts workflows.
    # [skip ci] used to suppress this re-entry and, with it, every pull_request
    # workflow headed by that commit (develop→main gates included). Skip only
    # the release-commit push. That skip does not keep the run out of the
    # concurrency group — see the noop group above. workflow_dispatch still
    # runs. github.actor is the token owner, not semantic-release-bot — that
    # name is the git committer — so this matches the message and committer,
    # as relay-release-status does.
    if: >-
      !(github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.x'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # SDK 10 from global.json builds the library and runs net10.0 tests;
          # net48 (preinstalled on windows-latest) exercises the netstandard2.0 asset.
          global-json-file: global.json

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build
        env:
          CI: true
        run: dotnet build --configuration Release --no-restore

      # Same fresh results directory as build.yml. The gate and the Codecov
      # upload both receive it; files in the checkout are not inputs.
      - name: Test
        id: test
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" ]]; then
            echo "RUNNER_TEMP is not set." >&2
            exit 1
          fi
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          results="$(mktemp -d "${temp_root}/coverage.XXXXXX")"
          dotnet_results="$results"
          if command -v cygpath >/dev/null 2>&1; then
            dotnet_results="$(cygpath -w "$results")"
          fi
          # xUnit.net v3 (xunit.v3.mtp-off) runs the test executable in its own
          # process and does not create AppDomains, so the v2
          # xUnit.AppDomain=denied switch is not passed. MTP stays off so
          # coverlet.collector can still write Cobertura through VSTest.
          MSYS_NO_PATHCONV=1 dotnet test --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory "$dotnet_results"
          echo "results_directory=${results}" >> "$GITHUB_OUTPUT"

      # Shared gate with build.yml — see tools/enforce-coverage-threshold.sh.
      - name: Enforce coverage threshold
        id: coverage_gate
        shell: bash
        run: bash tools/enforce-coverage-threshold.sh "${{ steps.test.outputs.results_directory }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_gate.outputs.coverage_files }}
          disable_search: true
          fail_ci_if_error: true

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CREDENTIALS: x-access-token:${{ secrets.RELEASE_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
        shell: bash
        run: bash tools/semantic-release-run.sh
