name: Semantic Release

env:
  COVERAGE_MIN_PERCENT: "95.0"

# Started by hand only (Actions → Semantic Release → Run workflow) on `develop`
# for a beta pre-release or on `main` for a stable release. A push no longer
# publishes: merging is not the same decision as releasing, and a workflow that
# runs on every push to a channel branch puts the publishing credentials within
# reach of whoever can merge.
on:
  workflow_dispatch:

# Nothing by default. Only the `release` job gets write access and the OIDC
# grant, and only after `verify` has passed on the same commit.
permissions:
  contents: read

concurrency:
  # Releases on the same channel must not overlap. semantic-release pushes the
  # tag and channel note before publishing, so an overlapping run could mistake
  # that in-progress release for an incomplete one and race its repair.
  #
  # main and develop use separate groups: a develop push must not evict a pending
  # main release (Actions retains only one pending run per group). The required
  # main→develop back-merge happens only after the stable release has completed,
  # so develop cannot concurrently repair the stable tag still being published.
  #
  # A release-commit push (chore(release): by semantic-release-bot) must not
  # carry [skip ci]: that would also skip every develop→main pull_request gate.
  # Its push still queues this workflow before the job-level skip is evaluated.
  # Give that no-op a per-SHA group so it cannot evict a real pending release.
  # Non-channel workflow_dispatch refs likewise get their own groups.
  #
  # Queue rather than cancel: cancelling a run mid-publish is precisely how the
  # partial releases this pipeline repairs come about.
  group: >-
    ${{
      (github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot') &&
      format('semantic-release-noop-{0}', github.sha) ||
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      format('semantic-release-{0}', github.ref_name) ||
      format('semantic-release-{0}', github.ref)
    }}
  cancel-in-progress: false

jobs:
  verify:
    # windows-latest is required so the net48 test host can bind and execute the
    # library's netstandard2.0 asset before publishing (net10.0 runs on the same job).
    #
    # Build, test and the coverage gate run here, without the OIDC grant and
    # without RELEASE_TOKEN: this is where the code under release and its test
    # dependencies execute.
    #
    # The release-commit guard predates the manual trigger. It is kept so that a
    # push trigger added later cannot re-enter on the release commit (see the
    # noop concurrency group above).
    if: >-
      !(github.event_name == 'push' &&
        github.event.head_commit &&
        startsWith(github.event.head_commit.message, 'chore(release):') &&
        github.event.head_commit.committer.name == 'semantic-release-bot')
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Refuse to run off main or develop
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Wrong branch::Releases run from main or develop only. This run is on ${REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # SDK 11 from global.json builds the library and runs net10.0 tests;
          # net48 (preinstalled on windows-latest) exercises the netstandard2.0 asset.
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore --locked-mode

      - name: Build
        env:
          CI: true
        run: dotnet build --configuration Release --no-restore

      # Same fresh results directory as build.yml. The gate and the Codecov
      # upload both receive it; files in the checkout are not inputs.
      - name: Test
        id: test
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" ]]; then
            echo "RUNNER_TEMP is not set." >&2
            exit 1
          fi
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          results="$(mktemp -d "${temp_root}/coverage.XXXXXX")"
          dotnet_results="$results"
          if command -v cygpath >/dev/null 2>&1; then
            dotnet_results="$(cygpath -w "$results")"
          fi
          # xUnit.net v3 (xunit.v3.mtp-off) runs the test executable in its own
          # process and does not create AppDomains, so the v2
          # xUnit.AppDomain=denied switch is not passed. MTP stays off so
          # coverlet.collector can still write Cobertura through VSTest.
          MSYS_NO_PATHCONV=1 dotnet test --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory "$dotnet_results"
          echo "results_directory=${results}" >> "$GITHUB_OUTPUT"

      # Shared gate with build.yml — see tools/enforce-coverage-threshold.sh.
      - name: Enforce coverage threshold
        id: coverage_gate
        shell: bash
        run: bash tools/enforce-coverage-threshold.sh "${{ steps.test.outputs.results_directory }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_gate.outputs.coverage_files }}
          disable_search: true
          # The local coverage gate above is blocking. A Codecov service outage
          # must not prevent an otherwise verified release from publishing.
          fail_ci_if_error: false

  release:
    needs: verify
    # The guard belongs on the job that holds the credentials, not only upstream.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    # Same runner as before: the pack in tools/semantic-release-publish.sh and the
    # repair paths in tools/semantic-release-run.sh are written for Windows.
    runs-on: windows-latest
    # The `release` environment deploys from main and develop only and holds
    # RELEASE_TOKEN. Its name is also in the OIDC token, so the nuget.org
    # Trusted Publishing policy can be bound to it.
    environment: release
    permissions:
      contents: write   # GitHub release and its assets (GH_TOKEN)
      id-token: write   # OIDC token for NuGet Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.x'

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # --ignore-scripts: no package lifecycle script runs inside the OIDC grant.
      # The release tooling has no install scripts of its own.
      - name: Install release tooling
        run: npm ci --ignore-scripts

      # The pack in tools/semantic-release-publish.sh runs with --no-restore.
      # Locked mode keeps it to the packages verify just built and tested.
      - name: Restore .NET dependencies
        run: dotnet restore --locked-mode

      # Temporary API key, valid about an hour. Request it in this job
      # immediately before publish, including the incomplete-release repair.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: dborgards

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CREDENTIALS: x-access-token:${{ secrets.RELEASE_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: ${{ vars.SEMANTIC_RELEASE_BOT_EMAIL }}
        shell: bash
        run: bash tools/semantic-release-run.sh
